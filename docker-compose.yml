version: '3.8'

services:
  resume-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-agent
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - resume-data:/app/data

volumes:
  resume-data:
